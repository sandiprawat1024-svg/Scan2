<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f4c5c">
<title>दुकान स्कैनर</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #eef2f4;
    --card: #ffffff;
    --ink: #14232b;
    --muted: #5d6f78;
    --brand: #0f4c5c;
    --sell: #1b7f4b;
    --warn: #b3261e;
    --line: #d5dde1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    max-width: 460px; margin-inline: auto;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 12px; }
  h1 { font-size: 20px; margin: 0; }
  #sync { font-size: 13px; color: var(--muted); }
  #sync.pending { color: #8a5a00; font-weight: 600; }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .hidden { display: none !important; }
  .name { font-size: 22px; font-weight: 700; margin: 0 0 4px; word-break: break-word; }
  .code { font-size: 13px; color: var(--muted); margin: 0 0 12px; word-break: break-all; }
  .row { display: flex; gap: 10px; }
  .stat { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .stat small { display: block; color: var(--muted); font-size: 12px; }
  .stat b { font-size: 26px; }
  .stat.low b { color: var(--warn); }
  button {
    width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer; color: #fff; background: var(--brand);
  }
  button.sell { background: var(--sell); font-size: 18px; padding: 16px; }
  button.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  button:disabled { opacity: .5; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-top: 10px; }
  input[type=text], input[type=number], input[inputmode] {
    width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid var(--line);
    border-radius: 10px; margin-top: 4px; background: #fff; color: var(--ink);
  }
  .manual { display: flex; gap: 8px; margin-top: 12px; }
  .manual input { margin: 0; }
  .manual button { width: auto; margin: 0; padding: 12px 18px; }
  .auto { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; color: var(--ink); }
  .auto input { width: 20px; height: 20px; margin: 0; }
  #msg { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 15px; background: #dff3e8; color: #0d5a34; }
  #msg.err { background: #fbe3e1; color: var(--warn); }
  .notice { color: var(--muted); font-size: 14px; margin: 8px 2px 0; }
</style>
</head>
<body>

<div class="top">
  <h1>दुकान स्कैनर</h1>
  <span id="sync">…</span>
</div>

<div id="reader"></div>

<div class="manual">
  <input id="manualCode" inputmode="numeric" placeholder="बारकोड हाथ से डालें" aria-label="बारकोड">
  <button id="manualBtn" type="button">खोजें</button>
</div>

<label class="auto"><input type="checkbox" id="auto" checked> बिक्री के बाद अपने-आप अगला स्कैन</label>

<div id="msg" class="hidden" role="status"></div>

<!-- मिला हुआ प्रोडक्ट -->
<section id="itemCard" class="card hidden">
  <p class="name" id="iName"></p>
  <p class="code" id="iCode"></p>
  <div class="row">
    <div class="stat"><small>कीमत</small><b>₹<span id="iPrice"></span></b></div>
    <div class="stat" id="stockBox"><small>बचा स्टॉक</small><b id="iStock"></b></div>
  </div>
  <button class="sell" id="sellBtn" type="button">बिक्री दर्ज करें (1 पीस कम)</button>
  <button class="ghost" id="addBtn" type="button">स्टॉक जोड़ें</button>
  <button class="ghost" id="nextBtn" type="button">अगला स्कैन करें</button>
</section>

<!-- नया प्रोडक्ट -->
<section id="newCard" class="card hidden">
  <p class="name">यह बारकोड नया है</p>
  <p class="code" id="nCode"></p>
  <label for="nName">आइटम का नाम</label>
  <input id="nName" type="text" placeholder="जैसे: Kurti">
  <label for="nPrice">कीमत (₹)</label>
  <input id="nPrice" type="number" inputmode="decimal" min="0">
  <label for="nStock">कितने पीस हैं</label>
  <input id="nStock" type="number" inputmode="numeric" min="0">
  <button id="saveNewBtn" type="button">आइटम सेव करें</button>
  <button class="ghost" id="cancelNewBtn" type="button">रद्द करें</button>
</section>

<p class="notice">कैमरा चालू न हो तो ब्राउज़र में कैमरा अनुमति दें। ऐप https लिंक पर खुलना चाहिए।</p>

<script>
  // ⬇️ अपना Apps Script वाला Web App URL (नई deployment के बाद भी वही रहेगा)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx_F-Vvvayt56mpLK0hUI6TR5kVSINvis5ES8wXgcif3oTgaKECbSTd0tSaCHDjRnutKQ/exec";

  const LS_ITEMS = "dukan_items_v1";
  const LS_QUEUE = "dukan_queue_v1";
  const LS_AUTO  = "dukan_auto_v1";

  const $ = (id) => document.getElementById(id);

  /* ---------- स्थिति (state) ---------- */
  let items = {};            // barcode -> {barcode,itemName,price,stock}  (फोन की अपनी कॉपी)
  let queue = [];            // सर्वर को भेजने बाकी बदलाव
  let loaded = false;        // क्या पूरा डेटा एक बार आ चुका है
  let version = 0;           // हर बदलाव पर +1, ताकि पुराना sync नया डेटा न मिटाए
  let sending = false;
  let scanner = null;
  let scanning = false;
  let locked = false;        // एक स्कैन चल रहा है
  let currentCode = "";

  try { items = JSON.parse(localStorage.getItem(LS_ITEMS) || "{}"); } catch (e) { items = {}; }
  try { queue = JSON.parse(localStorage.getItem(LS_QUEUE) || "[]"); } catch (e) { queue = []; }
  try { $("auto").checked = localStorage.getItem(LS_AUTO) !== "0"; } catch (e) {}
  loaded = Object.keys(items).length > 0;

  function saveItems() { try { localStorage.setItem(LS_ITEMS, JSON.stringify(items)); } catch (e) {} }
  function saveQueue() {
    try { localStorage.setItem(LS_QUEUE, JSON.stringify(queue)); } catch (e) {}
    updateSyncUI();
  }
  $("auto").onchange = () => { try { localStorage.setItem(LS_AUTO, $("auto").checked ? "1" : "0"); } catch (e) {} };

  function updateSyncUI() {
    const s = $("sync");
    if (queue.length) { s.textContent = "⏳ " + queue.length + " भेजना बाकी"; s.className = "pending"; }
    else if (loaded)  { s.textContent = "✓ सब सेव"; s.className = ""; }
    else              { s.textContent = "डेटा लोड हो रहा…"; s.className = ""; }
  }

  /* ---------- छोटे हेल्पर ---------- */
  let audioCtx = null;
  function beep(freq = 880, ms = 100) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      o.frequency.value = freq; o.connect(audioCtx.destination); o.start();
      o.stop(audioCtx.currentTime + ms / 1000);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(50);
  }

  function showMsg(text, isErr) {
    const m = $("msg");
    m.textContent = text;
    m.classList.toggle("err", !!isErr);
    m.classList.remove("hidden");
  }
  function clearMsg() { $("msg").classList.add("hidden"); }
  function hideCards() { $("itemCard").classList.add("hidden"); $("newCard").classList.add("hidden"); }

  async function api(params) {
    const res = await fetch(WEB_APP_URL + "?" + new URLSearchParams(params).toString());
    return await res.json();
  }

  /* ---------- सर्वर को बदलाव भेजना (background) ---------- */
  function enqueue(params) {
    params.opid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    queue.push(params);
    version++;
    saveQueue();
    processQueue();
  }

  async function processQueue() {
    if (sending) return;
    sending = true;
    try {
      while (queue.length) {
        let d;
        try { d = await api(queue[0]); }
        catch (e) { setTimeout(processQueue, 5000); return; }          // नेट नहीं: बाद में फिर कोशिश
        if (d.status === "busy") { setTimeout(processQueue, 2000); return; }
        if (d.status === "no_stock" || d.status === "error") {
          showMsg("सर्वर पर एक बदलाव नहीं हुआ: " + (d.message || ""), true);
        }
        queue.shift();
        saveQueue();
      }
    } finally {
      sending = false;
    }
    syncAll();
  }

  /* ---------- सर्वर से पूरा डेटा लेना ---------- */
  async function syncAll() {
    if (queue.length || sending) return;
    const v = version;
    try {
      const d = await api({ action: "all" });
      if (d.status === "success" && queue.length === 0 && v === version) {
        const m = {};
        d.items.forEach((it) => { m[it.barcode] = it; });
        items = m;
        saveItems();
        loaded = true;
        updateSyncUI();
        if (currentCode && items[currentCode] && !$("itemCard").classList.contains("hidden")) {
          renderItem(items[currentCode]);
        }
      }
    } catch (e) {}
  }

  /* ---------- स्कैनर (कैमरा बंद नहीं होता, सिर्फ pause/resume) ---------- */
  async function startScanner() {
    if (scanning) return;
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE],
      useBarCodeDetectorIfSupported: true,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    try {
      await scanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h * 0.5, 160)) }) },
        onScan,
        () => {}
      );
      scanning = true;
    } catch (err) {
      scanning = false;
      showMsg("कैमरा शुरू नहीं हुआ। अनुमति दें, या नीचे हाथ से बारकोड डालें।", true);
    }
  }

  function pauseScan() { try { if (scanner && scanning) scanner.pause(true); } catch (e) {} }
  function resumeScan() {
    locked = false;
    if (!scanning) { startScanner(); return; }
    try { scanner.resume(); } catch (e) {}
  }

  function onScan(text) {
    if (locked) return;
    locked = true;
    beep();
    pauseScan();
    lookup(String(text).trim());
  }

  /* ---------- खोज (अब फोन के अंदर से, तुरंत) ---------- */
  async function lookup(code) {
    currentCode = code;
    hideCards();
    clearMsg();
    let it = items[code];

    // पहली बार, डेटा अभी आया नहीं: सर्वर से सीधे पूछो
    if (!it && !loaded) {
      showMsg("खोज रहे हैं…");
      try {
        const d = await api({ barcode: code, action: "get" });
        clearMsg();
        if (d.status === "success") { it = d.item; items[code] = it; saveItems(); }
      } catch (e) {
        showMsg("नेट नहीं है और डेटा अभी लोड नहीं हुआ।", true);
        setTimeout(() => { clearMsg(); resumeScan(); }, 1800);
        return;
      }
    }

    if (it) {
      renderItem(it);
    } else {
      $("nCode").textContent = "बारकोड: " + code;
      $("nName").value = ""; $("nPrice").value = ""; $("nStock").value = "";
      $("newCard").classList.remove("hidden");
    }
  }

  function renderItem(item) {
    $("iName").textContent = item.itemName;
    $("iCode").textContent = "बारकोड: " + item.barcode;
    $("iPrice").textContent = item.price;
    $("iStock").textContent = item.stock;
    $("stockBox").classList.toggle("low", item.stock <= 2);
    $("sellBtn").disabled = item.stock <= 0;
    $("itemCard").classList.remove("hidden");
  }

  /* ---------- बटन (सब तुरंत, सर्वर बाद में) ---------- */
  $("sellBtn").onclick = () => {
    const it = items[currentCode];
    if (!it || it.stock <= 0) return;
    it.stock -= 1;
    saveItems();
    enqueue({ barcode: currentCode, action: "sell", qty: 1 });
    beep(1200, 90);
    const low = it.stock <= 2 ? " ⚠ स्टॉक कम" : "";
    if ($("auto").checked) {
      hideCards();
      showMsg("✓ बिक्री: " + it.itemName + " — बचा " + it.stock + low, it.stock <= 2);
      resumeScan();
    } else {
      renderItem(it);
      showMsg("बिक्री दर्ज हो गई। अब स्टॉक: " + it.stock + low, it.stock <= 2);
    }
  };

  $("addBtn").onclick = () => {
    const it = items[currentCode];
    if (!it) return;
    const q = parseInt(prompt("कितने पीस जोड़ने हैं?", "1"), 10);
    if (!q || q < 1) return;
    it.stock += q;
    saveItems();
    enqueue({ barcode: currentCode, action: "add", qty: q });
    renderItem(it);
    showMsg("स्टॉक जुड़ गया। अब स्टॉक: " + it.stock);
  };

  $("saveNewBtn").onclick = () => {
    const name = $("nName").value.trim();
    const price = $("nPrice").value;
    const stock = $("nStock").value;
    if (!name || price === "" || stock === "") {
      showMsg("नाम, कीमत और स्टॉक तीनों भरें।", true);
      return;
    }
    const item = { barcode: currentCode, itemName: name, price: Number(price), stock: Number(stock) };
    items[currentCode] = item;
    saveItems();
    enqueue({ barcode: currentCode, action: "new", name: name, price: price, stock: stock });
    $("newCard").classList.add("hidden");
    renderItem(item);
    showMsg("नया आइटम जुड़ गया।");
  };

  function next() { hideCards(); clearMsg(); currentCode = ""; resumeScan(); }
  $("cancelNewBtn").onclick = next;
  $("nextBtn").onclick = next;

  $("manualBtn").onclick = () => {
    const code = $("manualCode").value.trim();
    if (!code || locked) return;
    locked = true;
    pauseScan();
    $("manualCode").value = "";
    lookup(code);
  };
  $("manualCode").addEventListener("keydown", (e) => { if (e.key === "Enter") $("manualBtn").click(); });

  /* ---------- शुरुआत ---------- */
  updateSyncUI();
  startScanner();
  processQueue();      // पिछली बार जो बदलाव बाकी रह गए थे
  syncAll();           // ताज़ा डेटा
  setInterval(syncAll, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { processQueue(); syncAll(); } });
  window.addEventListener("online", () => { processQueue(); syncAll(); });
</script>
</body>
  </html>
